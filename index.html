<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameList</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #1a1f36;
      --border: #2c3354;
      --text: #e8ebf7;
      --muted: #9aa3c7;
      --accent: #7c5cff;
      --accent-hover: #6a49f0;
      --danger: #ff6b81;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      background: radial-gradient(1200px 600px at 50% -10%, #1d2350 0%, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .brand { text-align: center; margin: 24px 0 20px; }
    .brand h1 { margin: 0; font-size: 2rem; letter-spacing: .02em; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 6px 0 0; color: var(--muted); }
    .narrow { max-width: 420px; margin: 0 auto; }
    .wide { max-width: 960px; margin: 0 auto; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
    label { display: block; margin-bottom: 14px; font-size: .9rem; color: var(--muted); }
    input {
      width: 100%;
      margin-top: 6px;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #12162b;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.block { width: 100%; padding: 12px; }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: wait; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .error { min-height: 1.3em; margin: 0 0 12px; color: var(--danger); font-size: .9rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .topbar h1 { margin: 0; font-size: 1.5rem; }
    .topbar h1 span { color: var(--accent); }
    .topbar .who { color: var(--muted); margin-right: 12px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .tabs button { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .placeholder { margin: 0; color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- ======================= LOGIN (issue #1) ======================= -->
  <main id="login-view" class="narrow">
    <header class="brand">
      <h1>Game<span>List</span></h1>
      <p>Sua lista de jogos, num só lugar.</p>
    </header>
    <section class="card" aria-labelledby="login-title">
      <h2 id="login-title" style="margin-top:0">Entrar</h2>
      <form id="login-form" novalidate>
        <label>Usuário
          <input id="username" name="username" autocomplete="username" required>
        </label>
        <label>Senha
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="error" role="alert" aria-live="polite"></p>
        <button id="login-button" class="block" type="submit">Entrar</button>
      </form>
    </section>
  </main>

  <!-- ================= TELA INICIAL / SHELL (issue #1) ================= -->
  <main id="app-view" class="wide" hidden>
    <header class="topbar">
      <h1>Game<span>List</span></h1>
      <div>
        <span class="who">Olá, <strong id="app-user"></strong></span>
        <button id="logout-button" type="button" class="secondary">Sair</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Seções">
      <button type="button" role="tab" data-tab="cadastro" aria-selected="true">Cadastro</button>
      <button type="button" role="tab" data-tab="listagem" aria-selected="false">Listagem</button>
      <button type="button" role="tab" data-tab="busca" aria-selected="false">Busca</button>
      <button type="button" role="tab" data-tab="dashboard" aria-selected="false">Dashboard</button>
    </nav>

    <!-- Cada issue escreve SOMENTE dentro do seu bloco. Estilos próprios podem usar <style> dentro do bloco. -->
    <section id="tab-cadastro" class="card" role="tabpanel">
      <!-- ===== #2 inicio: cadastro/edição web (B) ===== -->
      <p class="placeholder">Cadastro de jogos: em breve (issue #2).</p>
      <!-- ===== #2 fim ===== -->
    </section>

    <section id="tab-listagem" class="card" role="tabpanel" hidden>
      <!-- ===== #3 inicio: listagem/exclusão web (C) ===== -->
      <style>
        .list-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .list-toolbar .count { color: var(--muted); font-size: .9rem; }
        .table-wrap { overflow-x: auto; }
        table.games { width: 100%; border-collapse: collapse; }
        table.games th, table.games td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        table.games th { color: var(--muted); font-size: .85rem; font-weight: 600; white-space: nowrap; }
        table.games th button.sort { padding: 0; background: transparent; color: inherit; font: inherit; font-weight: 600; }
        table.games th button.sort:hover:not(:disabled) { background: transparent; color: var(--text); }
        table.games th .arrow { display: inline-block; width: 1em; color: var(--accent); }
        table.games td.num, table.games th.num { text-align: right; }
        table.games input[type="checkbox"] { width: auto; margin: 0; cursor: pointer; }
        table.games tr.selected td { background: rgba(124, 92, 255, .12); }
        .sr-only { position: absolute; left: -9999px; }
        .list-empty { margin: 16px 0; color: var(--muted); text-align: center; }
        .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; color: var(--muted); }
        button.danger { background: var(--danger); color: #1a0b10; }
        button.danger:hover:not(:disabled) { background: #ff4d68; }
      </style>
      <div class="list-toolbar">
        <span id="list-count" class="count" aria-live="polite"></span>
        <button id="delete-selected" type="button" class="danger" disabled>Excluir selecionados</button>
      </div>
      <p id="list-error" class="error" role="alert" aria-live="polite"></p>
      <div class="table-wrap">
        <table class="games" aria-describedby="list-count">
          <thead>
            <tr>
              <th scope="col"><input id="select-all" type="checkbox" aria-label="Selecionar todos da página"></th>
              <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="title">Título <span class="arrow" aria-hidden="true"></span></button></th>
              <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="platform">Plataforma <span class="arrow" aria-hidden="true"></span></button></th>
              <th scope="col" aria-sort="none"><button type="button" class="sort" data-sort="genre">Gênero <span class="arrow" aria-hidden="true"></span></button></th>
              <th scope="col" class="num" aria-sort="none"><button type="button" class="sort" data-sort="rating">Nota <span class="arrow" aria-hidden="true"></span></button></th>
              <!-- Ponto de encaixe da #2: coluna das ações por linha (botão "Editar") -->
              <th scope="col"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody id="games-body"></tbody>
        </table>
      </div>
      <p id="list-empty" class="list-empty" hidden>Nenhum jogo cadastrado.</p>
      <nav class="pager" aria-label="Paginação">
        <button id="page-prev" type="button" class="secondary">Anterior</button>
        <span id="page-info"></span>
        <button id="page-next" type="button" class="secondary">Próxima</button>
      </nav>
      <!-- ===== #3 fim ===== -->
    </section>

    <section id="tab-busca" class="card" role="tabpanel" hidden>
      <!-- ===== #4 inicio: busca web (C) ===== -->
      <p class="placeholder">Busca avançada: em breve (issue #4).</p>
      <!-- ===== #4 fim ===== -->

      <!-- ===== #5 inicio: exportação CSV web (A) ===== -->
      <!-- ===== #5 fim ===== -->
    </section>

    <section id="tab-dashboard" class="card" role="tabpanel" hidden>
      <!-- ===== #6 inicio: dashboard web (A) ===== -->
      <p class="placeholder">Dashboard: em breve (issue #6).</p>
      <!-- ===== #6 fim ===== -->
    </section>
  </main>

  <script>
    // ======================= BASE COMPARTILHADA (issue #1) =======================
    const API = "/api/web";
    const TOKEN_KEY = "gamelist.token";
    const USER_KEY = "gamelist.user";

    const loginView = document.getElementById("login-view");
    const appView = document.getElementById("app-view");
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const loginButton = document.getElementById("login-button");

    function load(key) {
      try { return sessionStorage.getItem(key); } catch { return null; }
    }
    function save(key, value) {
      try {
        if (value) sessionStorage.setItem(key, value);
        else sessionStorage.removeItem(key);
      } catch { /* armazenamento indisponível: a sessão vale só até recarregar */ }
    }

    function showLogin() {
      appView.hidden = true;
      loginView.hidden = false;
      document.getElementById("username").focus();
    }
    function showApp(user) {
      document.getElementById("app-user").textContent = user;
      loginView.hidden = true;
      appView.hidden = false;
    }
    function logout() {
      save(TOKEN_KEY, null);
      save(USER_KEY, null);
      showLogin();
    }

    // Use apiFetch em todas as chamadas protegidas: envia o Bearer e volta ao login em caso de 401.
    async function apiFetch(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      const token = load(TOKEN_KEY);
      if (token) headers.Authorization = `Bearer ${token}`;
      if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
      const response = await fetch(`${API}${path}`, { ...options, headers });
      if (response.status === 401) logout();
      return response;
    }

    function showTab(name) {
      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.setAttribute("aria-selected", String(button.dataset.tab === name));
      });
      document.querySelectorAll("[role=tabpanel]").forEach((panel) => {
        panel.hidden = panel.id !== `tab-${name}`;
      });
    }
    document.querySelectorAll("[data-tab]").forEach((button) => {
      button.addEventListener("click", () => showTab(button.dataset.tab));
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) {
        errorBox.textContent = "Informe usuário e senha.";
        return;
      }
      loginButton.disabled = true;
      try {
        const response = await fetch(`${API}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        if (response.status === 401) {
          errorBox.textContent = "Usuário ou senha inválidos.";
          return;
        }
        if (!response.ok) {
          errorBox.textContent = "Não foi possível entrar agora. Tente novamente.";
          return;
        }
        const data = await response.json();
        save(TOKEN_KEY, data.token);
        save(USER_KEY, username);
        form.reset();
        showApp(username);
      } catch {
        errorBox.textContent = "Sem conexão com a API.";
      } finally {
        loginButton.disabled = false;
      }
    });

    document.getElementById("logout-button").addEventListener("click", logout);

    // ======================= BLOCOS POR ISSUE (JavaScript) =======================

    // ===== #2 inicio: cadastro/edição web (B) =====
    // ===== #2 fim =====

    // ===== #3 inicio: listagem/exclusão web (C) =====
    const LIST_PAGE_SIZE = 5;
    const listState = { page: 1, sort: "title", order: "asc", total: 0, items: [], selected: new Set() };
    const listBody = document.getElementById("games-body");
    const listError = document.getElementById("list-error");
    const deleteButton = document.getElementById("delete-selected");
    const selectAll = document.getElementById("select-all");
    const pagePrev = document.getElementById("page-prev");
    const pageNext = document.getElementById("page-next");

    function listLastPage() {
      return Math.max(1, Math.ceil(listState.total / LIST_PAGE_SIZE));
    }

    function renderList() {
      listBody.replaceChildren();
      for (const game of listState.items) {
        const row = document.createElement("tr");
        row.dataset.id = String(game.id);
        row.classList.toggle("selected", listState.selected.has(game.id));

        const checkCell = document.createElement("td");
        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = listState.selected.has(game.id);
        check.setAttribute("aria-label", `Selecionar ${game.title}`);
        check.addEventListener("change", () => {
          if (check.checked) listState.selected.add(game.id);
          else listState.selected.delete(game.id);
          renderList();
        });
        checkCell.append(check);
        row.append(checkCell);

        // textContent (nunca innerHTML): títulos vindos do banco não executam HTML.
        for (const field of ["title", "platform", "genre", "rating"]) {
          const cell = document.createElement("td");
          cell.textContent = field === "rating" ? Number(game.rating).toFixed(1) : game[field];
          if (field === "rating") cell.className = "num";
          row.append(cell);
        }

        // Ponto de encaixe da #2: a issue de edição adiciona aqui o botão "Editar" da linha.
        const actions = document.createElement("td");
        actions.className = "row-actions";
        row.append(actions);

        listBody.append(row);
      }

      const last = listLastPage();
      document.getElementById("list-empty").hidden = listState.total > 0;
      document.getElementById("list-count").textContent = `${listState.total} jogo(s)`;
      document.getElementById("page-info").textContent = `Página ${listState.page} de ${last}`;
      pagePrev.disabled = listState.page <= 1;
      pageNext.disabled = listState.page >= last;
      deleteButton.disabled = listState.selected.size === 0;
      selectAll.checked = listState.items.length > 0 && listState.items.every((g) => listState.selected.has(g.id));

      document.querySelectorAll("#tab-listagem [data-sort]").forEach((button) => {
        const active = button.dataset.sort === listState.sort;
        const ascending = listState.order === "asc";
        button.querySelector(".arrow").textContent = active ? (ascending ? "▲" : "▼") : "";
        button.closest("th").setAttribute("aria-sort", active ? (ascending ? "ascending" : "descending") : "none");
      });
    }

    async function loadGames() {
      listError.textContent = "";
      const query = new URLSearchParams({
        page: String(listState.page),
        page_size: String(LIST_PAGE_SIZE),
        sort: listState.sort,
        order: listState.order,
      });
      try {
        const response = await apiFetch(`/records?${query}`);
        if (response.status === 401) return;
        if (!response.ok) throw new Error("falha ao listar");
        const data = await response.json();
        listState.total = data.total;
        // Depois de excluir tudo da última página, volta para a nova última página.
        if (data.items.length === 0 && listState.page > 1) {
          listState.page = listLastPage();
          return loadGames();
        }
        listState.items = data.items;
        renderList();
      } catch {
        listError.textContent = "Não foi possível carregar os jogos.";
      }
    }

    document.querySelectorAll("#tab-listagem [data-sort]").forEach((button) => {
      button.addEventListener("click", () => {
        const field = button.dataset.sort;
        if (listState.sort === field) listState.order = listState.order === "asc" ? "desc" : "asc";
        else { listState.sort = field; listState.order = "asc"; }
        listState.page = 1;
        loadGames();
      });
    });

    pagePrev.addEventListener("click", () => { listState.page -= 1; loadGames(); });
    pageNext.addEventListener("click", () => { listState.page += 1; loadGames(); });

    selectAll.addEventListener("change", () => {
      for (const game of listState.items) {
        if (selectAll.checked) listState.selected.add(game.id);
        else listState.selected.delete(game.id);
      }
      renderList();
    });

    deleteButton.addEventListener("click", async () => {
      const ids = [...listState.selected];
      if (ids.length === 0) return;
      if (!confirm(`Excluir ${ids.length} jogo(s) selecionado(s)?`)) return;
      deleteButton.disabled = true;
      listError.textContent = "";
      let failed = 0;
      for (const id of ids) {
        try {
          const response = await apiFetch(`/records/${id}`, { method: "DELETE" });
          // 404 = já excluído por outro lugar: some da seleção do mesmo jeito.
          if (response.status === 204 || response.status === 404) listState.selected.delete(id);
          else failed += 1;
        } catch {
          failed += 1;
        }
      }
      await loadGames();
      if (failed > 0) listError.textContent = `Não foi possível excluir ${failed} jogo(s).`;
    });

    // Carrega do banco quando a área logada aparece (login ou sessão restaurada) e ao abrir a aba.
    // Ao sair (logout), limpa a seleção para a próxima sessão começar do zero.
    new MutationObserver(() => {
      if (appView.hidden) {
        listState.selected.clear();
        listState.page = 1;
      } else {
        loadGames();
      }
    }).observe(appView, { attributes: true, attributeFilter: ["hidden"] });
    document.querySelector('[data-tab="listagem"]').addEventListener("click", loadGames);
    // ===== #3 fim =====

    // ===== #4 inicio: busca web (C) =====
    // ===== #4 fim =====

    // ===== #5 inicio: exportação CSV web (A) =====
    // ===== #5 fim =====

    // ===== #6 inicio: dashboard web (A) =====
    // ===== #6 fim =====

    // ======================= INICIALIZAÇÃO =======================
    // Ao abrir a página, reaproveita a sessão se o token ainda for válido.
    (async function restoreSession() {
      if (!load(TOKEN_KEY)) return showLogin();
      try {
        const response = await apiFetch("/me");
        if (!response.ok) throw new Error("sessão inválida");
        showApp(load(USER_KEY) || "");
      } catch {
        logout();
      }
    })();
  </script>
</body>
</html>
